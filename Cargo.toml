[package]
name = "sleeper-zone-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "sleeper_zone"
path = "src/lib.rs"

[[bin]]
name = "sleeper-zone-desktop"
path = "src/main.rs"

[dependencies]
# Cross-platform baseline: `wayland`/`x11` are Unix-only and come from
# the Linux target section below. Windows builds on winit's win32
# backend with just `glow`.
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Unix display backends (cargo merges features for the same crate).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["wayland", "x11"] }

[build-dependencies]
# Version/FileDescription metadata stamped into the Windows exe by
# build.rs. Pure-Rust crate; inert on non-Windows hosts.
winres = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
criterion = "0.7"

[[bench]]
name = "join"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
